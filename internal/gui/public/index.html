<!doctype html>
<html lang="ja" data-theme="white-soft">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>DevRelay</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="app">
    <section class="logs" aria-label="Logs">
      <article class="log-card">
        <h2>Command log</h2>
        <div id="aiLog" class="log-view" role="log" aria-live="polite">
          <div class="empty-state">No commands yet.</div>
        </div>
      </article>
      <article class="log-card">
        <h2>Server log</h2>
        <div id="pluginLog" class="log-view" role="log" aria-live="polite">
          <div class="empty-state">Waiting for server output.</div>
        </div>
      </article>
    </section>    <div id="settingsBackdrop" class="settings-backdrop" aria-hidden="true">
      <aside id="settingsPanel" class="settings-panel" aria-label="Settings">
        <h3>Settings</h3>
        <section id="oauthApproval" class="oauth-approval" hidden>
          <div class="oauth-kicker">OAuth access request</div>
          <strong id="oauthClientName">ChatGPT</strong>
          <div class="oauth-detail">Redirect: <code id="oauthRedirectHost"></code></div>
          <div class="oauth-detail">Scopes: <code id="oauthScopes"></code></div>
          <div class="oauth-detail">Device: <code id="oauthDeviceName"></code></div>
          <div class="oauth-actions">
            <button id="denyOAuth" type="button">Deny</button>
            <button id="approveOAuth" type="button">Approve</button>
          </div>
        </section>
        <label>Device name
          <input id="deviceNameInput" type="text" maxlength="80" autocomplete="off">
        </label>
        <div class="device-default">Default <code id="deviceDefaultName">-</code></div>
        <div class="device-default">Node <code id="deviceNodeId">-</code></div>
        <label>Aliases
          <input id="deviceAliasesInput" type="text" maxlength="240" autocomplete="off" placeholder="dev, main">
        </label>
        <div class="settings-section-title">Cluster</div>
        <label class="toggle-row">
          <span>Enable peer routing</span>
          <input id="clusterEnabledInput" type="checkbox">
        </label>
        <label>Peer port
          <input id="clusterPortInput" type="number" min="1" max="65535" step="1" inputmode="numeric">
        </label>
        <label>Peers
          <textarea id="clusterPeersInput" rows="3" spellcheck="false" placeholder="http://100.64.0.2:7319"></textarea>
        </label>
        <label>Cluster key
          <div class="cluster-key-row">
            <input id="clusterKeyInput" type="password" autocomplete="off">
            <button id="copyClusterKey" type="button">Copy</button>
          </div>
        </label>
        <div class="cluster-note">Use the same key on every trusted DevRelay node.</div>
        <label>Theme
          <select id="themeSelect">
            <option value="white-soft">#FFFFFF Soft</option>
            <option value="black-soft">#000000 Soft</option>
          </select>
        </label>
        <label>Mode
          <select id="modeSelect">
            <option value="https">HTTPS Named Tunnel</option>
            <option value="chatgpt">OpenAI Secure Tunnel</option>
          </select>
        </label>
        <label>Port
          <input id="portInput" type="number" min="1024" max="65535" step="1" inputmode="numeric">
        </label>
        <label class="toggle-row">
          <span>Auto start</span>
          <input id="autoStartInput" type="checkbox">
        </label>
        <button id="saveSettings" class="save-button" type="button">Save</button>
        <div id="settingsMessage" class="settings-message" aria-live="polite"></div>        <div class="endpoint">
          <span>Endpoint</span>
          <code id="publicUrl">-</code>
        </div>
      </aside>
    </div>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
