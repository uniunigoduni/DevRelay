<!doctype html>
<html lang="en" data-theme="white-soft">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>DevRelay Setup</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="setup-shell">
    <header class="hero">
      <h1>Connection setup</h1>
      <div id="busyBadge" class="status-pill" hidden>Working...</div>
    </header>

    <section id="notice" class="notice" hidden></section>
    <section id="currentCard" class="current-card" hidden></section>

    <section id="busyPanel" class="busy-panel" hidden>
      <strong id="busyTitle">Working</strong>
      <div id="busyDetail"></div>
      <code id="busyApprovalUrl" hidden></code>
      <div class="actions">
        <button id="openApprovalButton" class="button secondary" type="button" hidden>Open approval page</button>
        <button id="abortSetupButton" class="button secondary" type="button">Stop waiting</button>
      </div>
    </section>

    <nav id="breadcrumbs" class="breadcrumbs" aria-label="Setup path"></nav>
    <section id="content" class="content" aria-live="polite"></section>

    <footer class="footer">
      <button id="backButton" class="button secondary" type="button" hidden>Back</button>
      <div class="footer-spacer"></div>
      <button id="cancelButton" class="button secondary" type="button">Cancel</button>
    </footer>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
