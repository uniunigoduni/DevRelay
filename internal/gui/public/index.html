<!doctype html>
<html lang="ja" data-theme="white-soft">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>DevRelay</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="app">
    <section class="logs" aria-label="Logs">
      <article class="log-card">
        <h2>Command log</h2>
        <div id="aiLog" class="log-view" role="log" aria-live="polite">
          <div class="empty-state">No commands yet.</div>
        </div>
      </article>
      <div id="logSplitter" class="log-splitter" role="separator" aria-orientation="horizontal" aria-label="Resize command and server logs" aria-valuemin="15" aria-valuemax="85" aria-valuenow="50" tabindex="0"></div>
      <article class="log-card">
        <h2>Server log</h2>
        <div id="pluginLog" class="log-view" role="log" aria-live="polite">
          <div class="empty-state">Waiting for server output.</div>
        </div>
      </article>
    </section>    <div id="settingsBackdrop" class="settings-backdrop" aria-hidden="true">
      <aside id="settingsPanel" class="settings-panel" aria-label="Settings">
        <h3>Settings</h3>
        <label>Device name
          <input id="deviceNameInput" type="text" maxlength="80" autocomplete="off">
        </label>
        <div class="device-default">Default <code id="deviceDefaultName">-</code></div>
        <div class="device-default">Status <code id="deviceStatus">-</code></div>
        <div class="device-default">Node ID <code id="deviceNodeId">-</code></div>
        <label>Aliases
          <input id="deviceAliasesInput" type="text" maxlength="240" autocomplete="off" placeholder="dev, main">
        </label>
        <label>Theme
          <select id="themeSelect">
            <option value="white-soft">#FFFFFF Soft</option>
            <option value="black-soft">#000000 Soft</option>
          </select>
        </label>
        <div class="connection-setting">
          <button id="connectionSetup" class="secondary-button" type="button">Connection Setup...</button>
        </div>
        <label>Port
          <input id="portInput" type="number" min="1024" max="65535" step="1" inputmode="numeric">
        </label>
        <label class="toggle-row">
          <span>Auto start</span>
          <input id="autoStartInput" type="checkbox">
        </label>
        <button id="saveSettings" class="save-button" type="button">Save</button>
        <div id="settingsMessage" class="settings-message" aria-live="polite"></div>        <div class="endpoint">
          <span>Endpoint</span>
          <code id="publicUrl">-</code>
        </div>
      </aside>
    </div>
    <div id="oauthApproval" class="oauth-modal-backdrop" hidden>
      <section class="oauth-modal" role="dialog" aria-modal="true" aria-labelledby="oauthModalTitle" aria-describedby="oauthModalDescription">
        <div class="oauth-kicker">OAuth access request</div>
        <h2 id="oauthModalTitle">Allow access to DevRelay?</h2>
        <p id="oauthModalDescription">An application is requesting access to this DevRelay instance.</p>
        <div class="oauth-client" id="oauthClientName">OAuth client</div>
        <div class="oauth-detail">Redirect: <code id="oauthRedirectHost"></code></div>
        <div class="oauth-detail">Scopes: <code id="oauthScopes"></code></div>
        <div id="oauthMessage" class="oauth-message" aria-live="polite"></div>
        <div class="oauth-actions">
          <button id="denyOAuth" type="button">Reject</button>
          <button id="approveOAuth" type="button">Approve</button>
        </div>
      </section>
    </div>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
