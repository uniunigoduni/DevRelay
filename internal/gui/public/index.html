<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>DevRelay</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="app">
    <section class="logs" aria-label="Logs">
      <article class="log-card">
        <h2>Command log</h2>
        <div id="aiLog" class="log-view" role="log" aria-live="polite">
          <div class="empty-state">No commands yet.</div>
        </div>
      </article>
      <article class="log-card">
        <h2>Server log</h2>
        <div id="pluginLog" class="log-view" role="log" aria-live="polite">
          <div class="empty-state">Waiting for server output.</div>
        </div>
      </article>
    </section>

    <div id="settingsBackdrop" class="settings-backdrop" aria-hidden="true">
      <aside id="settingsPanel" class="settings-panel" aria-label="Settings">
        <h3>Settings</h3>
        <label>Mode
          <select id="modeSelect">
            <option value="https">HTTPS Named Tunnel</option>
            <option value="chatgpt">OpenAI Secure Tunnel</option>
          </select>
        </label>
        <label>Port
          <input id="portInput" type="number" min="1024" max="65535" step="1" inputmode="numeric">
        </label>
        <label class="toggle-row">
          <span>Auto start</span>
          <input id="autoStartInput" type="checkbox">
        </label>
        <button id="saveSettings" class="save-button" type="button">Save</button>
        <div id="settingsMessage" class="settings-message" aria-live="polite"></div>
        <div class="endpoint">
          <span>Endpoint</span>
          <code id="publicUrl">—</code>
        </div>
      </aside>
    </div>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
